name: snapshot

on:
  schedule:
    - cron: "7 * * * *" # hourly
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/snapshot.py"]

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch pools and roll history
        run: python scripts/snapshot.py
      - name: Commit data
        run: |
          git config user.name "metric-radar-bot"
          git config user.email "metric-radar-bot@users.noreply.github.com"
          git add data/latest.json data/history.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
