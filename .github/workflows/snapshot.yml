name: snapshot

# Hourly: fetch every pool from Metric's public API and publish latest.json + history.json to the `data` branch.
# The branch is a single commit that gets replaced each run, so the repository does not grow and `main` stays code-only.

on:
  schedule:
    - cron: "7 * * * *" # hourly
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/snapshot.py", ".github/workflows/snapshot.yml"]

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore history from the data branch
        run: |
          mkdir -p data
          rc=0
          git ls-remote --exit-code --heads origin data >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch --quiet --depth 1 origin data
            git show FETCH_HEAD:history.json > data/history.json
          elif [ "$rc" -eq 2 ]; then
            echo "no data branch yet: starting a new history"
          else
            echo "could not query origin (git ls-remote exit $rc)" >&2
            exit 1
          fi
      - name: Fetch pools and roll history
        run: python scripts/snapshot.py
      - name: Publish to the data branch
        run: |
          git config user.name "metric-radar-bot"
          git config user.email "metric-radar-bot@users.noreply.github.com"
          latest=$(git hash-object -w data/latest.json)
          history=$(git hash-object -w data/history.json)
          tree=$(printf '100644 blob %s\tlatest.json\n100644 blob %s\thistory.json\n' "$latest" "$history" | git mktree)
          commit=$(git commit-tree "$tree" -m "snapshot: $(date -u +%Y-%m-%dT%H:%MZ)")
          git push --force origin "$commit:refs/heads/data"
